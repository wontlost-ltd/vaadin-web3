name: CI

on:
  push:
    branches:
      - main
  # 不限定目标分支：仓库默认分支目前不是 main，任何 PR 都应跑 CI
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm test
        working-directory: addon
      - run: npm ci && npm test
        working-directory: walletconnect
