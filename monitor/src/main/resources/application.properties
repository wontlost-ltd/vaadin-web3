server.port=${PORT:8080}
spring.datasource.url=${MONITOR_DATABASE_URL:jdbc:h2:file:./data/monitor;AUTO_SERVER=TRUE}
spring.datasource.username=${MONITOR_DATABASE_USERNAME:sa}
spring.datasource.password=${MONITOR_DATABASE_PASSWORD:}
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health
monitor.admin-token=${MONITOR_ADMIN_TOKEN:}
monitor.poll-interval=${MONITOR_POLL_INTERVAL:5s}
monitor.default-expiry=${MONITOR_DEFAULT_EXPIRY:1h}
monitor.not-before-tolerance=${MONITOR_NOT_BEFORE_TOLERANCE:2m}
monitor.pending-grace=${MONITOR_PENDING_GRACE:1h}
monitor.webhooks.allow-insecure=${MONITOR_WEBHOOK_ALLOW_INSECURE:false}
monitor.webhooks.allow-private-targets=${MONITOR_WEBHOOK_ALLOW_PRIVATE_TARGETS:false}
