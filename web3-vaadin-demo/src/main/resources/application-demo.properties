# Local development only. Anvil's default account and private key are public and must never hold real assets.
web3.dev.mock-wallet.enabled=true
web3.dev.mock-wallet.chain-id=31337
web3.chains.31337.rpc-url=http://127.0.0.1:8545
web3.chains.11155111.rpc-url=${SEPOLIA_RPC_URL:https://ethereum-sepolia-rpc.publicnode.com}
web3.demo.expected-chain-id=31337
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Optional failover example. Start a second Anvil node on port 8546 before enabling.
# web3.chains.31337.rpc-urls[0]=http://127.0.0.1:8545
# web3.chains.31337.rpc-urls[1]=http://127.0.0.1:8546
