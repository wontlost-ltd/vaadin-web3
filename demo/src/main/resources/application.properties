web3.rpc.11155111=https://ethereum-sepolia-rpc.publicnode.com
web3.rpc.84532=https://base-sepolia-rpc.publicnode.com
web3.rpc.1=
# Get a project ID from https://cloud.reown.com, or set WEB3_WALLETCONNECT_PROJECT_ID.
web3.walletconnect.project-id=${WEB3_WALLETCONNECT_PROJECT_ID:}
# Replace this placeholder with the address that should receive checkout payments.
web3.demo.recipient=0x0000000000000000000000000000000000000001

# Optional fiat on-ramp credentials. Values can be supplied through WEB3_ONRAMP_* environment variables.
web3.onramp.moonpay.publishable-key=${WEB3_ONRAMP_MOONPAY_PUBLISHABLE_KEY:}
web3.onramp.moonpay.secret-key=${WEB3_ONRAMP_MOONPAY_SECRET_KEY:}
web3.onramp.transak.api-key=${WEB3_ONRAMP_TRANSAK_API_KEY:}
web3.onramp.transak.api-secret=${WEB3_ONRAMP_TRANSAK_API_SECRET:}
web3.onramp.transak.referrer-domain=${WEB3_ONRAMP_TRANSAK_REFERRER_DOMAIN:localhost}
web3.onramp.transak.staging=${WEB3_ONRAMP_TRANSAK_STAGING:true}
web3.onramp.coinbase.key-id=${WEB3_ONRAMP_COINBASE_KEY_ID:}
web3.onramp.coinbase.key-secret=${WEB3_ONRAMP_COINBASE_KEY_SECRET:}

web3.monitor.url=${WEB3_MONITOR_URL:}
web3.monitor.api-key=${WEB3_MONITOR_API_KEY:}
web3.monitor.webhook-secret=${WEB3_MONITOR_WEBHOOK_SECRET:}
vaadin.exclude-urls=/webhooks/**
